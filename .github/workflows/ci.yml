name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crashcase
          POSTGRES_PASSWORD: crashcase
          POSTGRES_DB: crashcase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crashcase" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CC_TEST_PG_URL: postgresql+psycopg2://crashcase:crashcase@localhost:5432/crashcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,flows]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit + pgvector integration)
        run: pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: crashcase:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          tags: crashcase-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the image
        run: |
          docker run -d --name cc -p 8000:8000 \
            -e CC_INLINE_PROCESSING=true -e CC_DATABASE_URL=sqlite:////tmp/cc.db \
            crashcase:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          docker logs cc
