name: Deploy

# Runs after CI passes on main, or by hand. Stays off until the AWS stack exists:
# set the repository variable DEPLOY_ENABLED=true and the secret AWS_DEPLOY_ROLE_ARN
# (terraform output github_deploy_role_arn).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_percent:
        description: Share of API traffic sent to the new version while it bakes
        default: "10"
      bake_seconds:
        description: How long to watch the canary before promoting
        default: "300"
      seed:
        description: Seed the claim index with synthetic claims after deploying
        type: boolean
        default: false

permissions:
  id-token: write # GitHub OIDC -> AWS role, no stored AWS keys
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  NAME: crashcase

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image names
        id: img
        run: |
          SHA=$(git rev-parse --short HEAD)
          REG=${{ steps.ecr.outputs.registry }}
          echo "api=$REG/$NAME-api:$SHA" >> "$GITHUB_OUTPUT"
          echo "web=$REG/$NAME-web:$SHA" >> "$GITHUB_OUTPUT"
          echo "api_latest=$REG/$NAME-api:latest" >> "$GITHUB_OUTPUT"
          echo "web_latest=$REG/$NAME-web:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: INSTALL_ML=${{ vars.INSTALL_ML || 'false' }}
          push: true
          tags: ${{ steps.img.outputs.api }},${{ steps.img.outputs.api_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.img.outputs.web }},${{ steps.img.outputs.web_latest }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Canary deploy (auto-rollback on errors)
        env:
          API_IMAGE: ${{ steps.img.outputs.api }}
          WEB_IMAGE: ${{ steps.img.outputs.web }}
          CANARY_PERCENT: ${{ inputs.canary_percent || '10' }}
          BAKE_SECONDS: ${{ inputs.bake_seconds || '300' }}
        run: scripts/deploy/canary.sh

      - name: Seed the claim index
        if: inputs.seed
        run: |
          NET=$(aws ecs describe-services --cluster $NAME --services api-stable \
            --query 'services[0].networkConfiguration' --output json)
          TASK=$(aws ecs run-task --cluster $NAME --launch-type FARGATE \
            --task-definition $NAME-api --network-configuration "$NET" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","scripts/seed_claims.py","--per-group","20"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster $NAME --tasks "$TASK"
          aws ecs describe-tasks --cluster $NAME --tasks "$TASK" --query 'tasks[0].containers[0].exitCode'

      - name: Summary
        run: |
          URL=$(aws elbv2 describe-load-balancers --names $NAME --query 'LoadBalancers[0].DNSName' --output text)
          echo "### Deployed $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "App: http://$URL" >> "$GITHUB_STEP_SUMMARY"
