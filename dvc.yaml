# dvc repro   -> validate, de-duplicate, convert, baseline, train; re-running only what changed.
# Raw data is tracked by datasets/CarDD_COCO.dvc; `dvc pull` fetches it from the remote.
# A failing check exits non-zero and stops the pipeline before any training happens.
stages:
  validate:
    cmd: python training/validate_data.py --src datasets/CarDD_COCO --out reports/data_validation.json
    deps:
      - training/validate_data.py
      - datasets/CarDD_COCO
    params:
      - validate
    outs:
      - reports/data_validation.json:
          cache: false

  leakage:
    cmd: python training/check_leakage.py --src datasets/CarDD_COCO --out reports/leakage.json
    deps:
      - training/check_leakage.py
      - datasets/CarDD_COCO
      - reports/data_validation.json   # only runs on data that passed validation
    params:
      - leakage
    outs:
      - reports/leakage.json:
          cache: false

  prepare:
    cmd: python training/prepare_cardd.py --src datasets/CarDD_COCO --out datasets/cardd_yolo --leakage reports/leakage.json
    deps:
      - training/prepare_cardd.py
      - datasets/CarDD_COCO
      - reports/leakage.json
    outs:
      - datasets/cardd_yolo

  baseline:
    cmd: python training/baseline.py
    deps:
      - training/baseline.py
      - training/common.py
      - datasets/cardd_yolo
    params:
      - baseline
      - train.data
    metrics:
      - reports/baseline_metrics.json:
          cache: false

  train:
    cmd: python training/train.py
    deps:
      - training/train.py
      - training/common.py
      - datasets/cardd_yolo
      - reports/baseline_metrics.json   # the baseline is always logged before the model trains
    params:
      - train
    outs:
      - models/damage-seg.pt
    metrics:
      - metrics.json:
          cache: false
