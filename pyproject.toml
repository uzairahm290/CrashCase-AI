[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crashcase"
version = "0.1.0"
description = "CrashCase AI: visual retrieval-augmented car damage assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.2.5",
    "celery>=5.3",
    "redis>=5.0",
    "pillow>=10.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.2",
    "open_clip_torch>=2.24",
    "mlflow>=2.12",
]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults
